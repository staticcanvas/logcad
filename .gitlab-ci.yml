# ------------------------------------------------------
# Build stage
# ------------------------------------------------------
build:
  stage: build
  before_script:
    - apt-get update && apt-get install -y jq
  script:
    - echo "🔵 Building package..."
    - VERSION=$(jq -r .version package.json)
    - PROJECT_NAME=$(jq -r .name package.json)
    - echo "PROJECT_VERSION=$VERSION" >> build.env
    - echo "PROJECT_NAME=$PROJECT_NAME" >> build.env
    - npm ci
    - npm run build
    - echo "✅ Build complete!"
    - ls -lah dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env
  only:
    - merge_requests
    - main
    - tags
  allow_failure: false

# ------------------------------------------------------
# Deploy to Generic Package Registry
# ------------------------------------------------------
deploy:generic:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  # before_script:
  #   - apt-get update && apt-get install -y jq
  script:
    - echo "🔵 Uploading artifacts for version ${PROJECT_VERSION}..."
    # Define the list of files to upload
    - cd dist/logcad/dist
    - FILES=./*
    - |
      for FILE in $FILES; do
        echo "Uploading $FILE..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$FILE" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/${FILE}"
      done
    - echo "✅ All artifacts uploaded to Generic Registry"
  only:
    - /^v?\d+\.\d+\.\d+.*$/ # Only publish semantic version tags
  artifacts:
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env

# ------------------------------------------------------
# Deploy to npm (triggers jsDelivr automatically)
# > to bypass npm 2FA for automated releases
# > use https://docs.npmjs.com/trusted-publishers
# ------------------------------------------------------
deploy:npm:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - echo "🔵 Preparing npm publish..."
    # - npm ci
    # - npm run build
  script:
    - echo "🔵 Publishing to npm..."
    - |
    - cd dist/logcad
    - npm install -g npm@latest
# - echo "//registry.npmjs.org/:_authToken=${NPM_API_KEY}" > .npmrc # Using ID Token instead
    - npm ci
    - npm whoami
    - npm publish --access public
    - echo "✅ Published to npm!"
  only:
    - /^v?\d+\.\d+\.\d+.*$/ # Only publish semantic version tags
  when: manual
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}
  artifacts:
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env

# ------------------------------------------------------
# Auto-deploy on version tags (v1.0.0, 1.0.0, etc.)
# > to bypass npm 2FA for automated releases
# > use https://docs.npmjs.com/trusted-publishers
# ------------------------------------------------------
deploy:npm:auto:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - echo "🔵 Preparing npm publish..."
  script:
    - echo "🔵 Auto-publishing to npm..."
    - |
    - cd ./dist/logcad
    - npm install -g npm@latest
#    - echo "//registry.npmjs.org/:_authToken=${NPM_API_KEY}" > .npmrc # Using ID Token instead
    - npm ci
    - npm publish --access public
    - echo "✅ Published to npm!"
  only:
    - /^v?\d+\.\d+\.\d+$/ # Matches v1.0.0 or 1.0.0 format
  when: on_success
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}
  artifacts:
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env

# ------------------------------------------------------
# Create GitLab release
# As Per: https://docs.gitlab.com/user/project/releases/release_cli/
#   - Release-cli has been deprecated, use gitlab-cli instead
# ------------------------------------------------------
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: deploy:generic
      artifacts: false
    - job: build
      artifacts: true # Required to import PROJECT_VERSION from build.env
  before_script: [] # This prevents the global script (which causes the "unexpected redirection" error) from running.
  script:
    - echo "🚀 Generating release metadata for version $PROJECT_VERSION..."
  only:
    - /^v?\d+\.\d+\.\d+.*$/ # Only publish semantic version tags
  release:
    name: "Release ${PROJECT_NAME} v${PROJECT_VERSION}"
    tag_name: "${PROJECT_VERSION}"
    description: |
        # 📦 Version ${PROJECT_VERSION} Release

        ## NPM Package
        
         - https://www.npmjs.com/package/${CI_PROJECT_NAME}/v/${PROJECT_VERSION}

        ## 🌐 jsDelivr CDN
        
         - ***ES Module***: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js`
         - ***Universal Module***: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js`
         - ***ES Module Minified***: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.min.js`
         - ***Universal Module Minified***: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.min.js`

        ## 🌐 jsDelivr CDN

        ## 📋 Usage

        ### UMD (Browser)
        
        ```html
        <script src="[https://cdn.jsdelivr.net/npm/$](https://cdn.jsdelivr.net/npm/$){CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js"></script>
        ```

        ### ESM (Module)
        
        ```javascript
        
        import logcad from '[https://cdn.jsdelivr.net/npm/$](https://cdn.jsdelivr.net/npm/$){CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js';
        
        // or
        
        import { logcad } from '[https://cdn.jsdelivr.net/npm/$](https://cdn.jsdelivr.net/npm/$){CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js';
         ```
    assets:
      links:
        - name: 'logcad.esm.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.esm.js'
        - name: 'logcad.esm.js.map'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.esm.js.map'
        - name: 'logcad.esm.min.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.esm.min.js'
        - name: 'logcad.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.js'
        - name: 'logcad.js.map'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.js.map'
        - name: 'logcad.min.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.min.js'
        - name: 'logcad.min.js.map'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.min.js.map'
