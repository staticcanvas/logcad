#       - coverage/
#     expire_in: 1 week
#   only:
#     - merge_requests
#     - main
#     - tags
#   allow_failure: false

# ------------------------------------------------------
# Build stage
# ------------------------------------------------------
build:
  stage: build
  before_script:
    - echo "🔵 Preparing build..."
    - apt-get update && apt-get install -y jq
  script:
    - echo "🟢 Building package..."
    - VERSION=$(jq -r .version package.json)
    - PROJECT_NAME=$(jq -r .name package.json)
    - echo "PROJECT_VERSION=$VERSION" >> build.env
    - echo "PROJECT_NAME=$PROJECT_NAME" >> build.env
    - npm ci
    - npm run build
    - echo "✅ Build complete!"
    - ls -lah dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env
  only:
    - merge_requests
    - main
    - tags
  allow_failure: false

# ------------------------------------------------------
# Deploy to Generic Package Registry
# ------------------------------------------------------
deploy:generic:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  before_script:
    - echo "🔵 Preparing Generic Registry upload..."
  script:
    - echo "🟢 Uploading artifacts for version ${PROJECT_VERSION}..."
    # Define the list of files to upload
    - cd dist/logcad/dist
    - FILES=./*
    - |
      for FILE in $FILES; do
        echo "Uploading $FILE..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$FILE" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PROJECT_NAME}/${PROJECT_VERSION}/${FILE}"
      done
    - echo "✅ All artifacts uploaded to Generic Registry"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*$/
      when: always
  artifacts:
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env

# ------------------------------------------------------
# Deploy to npm (triggers jsDelivr automatically)
# > to bypass npm 2FA for automated releases
# > use https://docs.npmjs.com/trusted-publishers
# ------------------------------------------------------
deploy:npm:manual:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - echo "🔵 Preparing npm publish..."
    # check to see if npm package exists
    - |
      cd dist/logcad
      if npm view . >/dev/null 2>&1; then
        echo "ℹ️ npm package already exists. Skipping publish."
        exit 0
      else
        echo "ℹ️ npm package does not exist. Proceeding with publish."
      fi
  script:
    - echo "🟢 Publishing to npm..."
    - |
    - cd dist/logcad
    - npm install -g npm@latest
    - npm ci
    - npm whoami
    - npm publish --access public
    - echo "✅ Published to npm!"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*$/
      when: always
  when: manual
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}
  artifacts:
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env

# ------------------------------------------------------
# Auto-deploy on version tags (v1.0.0, 1.0.0, etc.)
# > to bypass npm 2FA for automated releases
# > use https://docs.npmjs.com/trusted-publishers
# ------------------------------------------------------
deploy:npm:auto:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - echo "🔵 Preparing npm publish..."
    # check to see if npm package exists
    - |
      cd dist/logcad
      if npm view . >/dev/null 2>&1; then
        echo "ℹ️ npm package already exists. Skipping publish."
        exit 0
      else
        echo "ℹ️ npm package does not exist. Proceeding with publish."
      fi
  script:
    - echo "🟢 Auto-publishing to npm..."
    - |
    - cd ./dist/logcad
    - npm install -g npm@latest
    - npm ci
    - npm publish --access public
    - echo "✅ Published to npm!"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*$/
      when: always
  when: on_success
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}
  artifacts:
    reports:
      # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env
      
# ------------------------------------------------------
# Publish to JSR (JavaScript Registry) for supply chain security
# As Per: https://jsr.dev/docs/publishing/
# ------------------------------------------------------
publish:jsr:auto:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  before_script:
    - echo "🔵 Preparing JSR publish..."
    # check to see if JSR package exists
    - |
      cd dist/logcad
      if npx jsr view @${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME} >/dev/null 2>&1; then
        echo "ℹ️ JSR package already exists. Skipping publish."
        exit 0
      else
        echo "ℹ️ JSR package does not exist. Proceeding with publish."
      fi
  script:
    # npx jsr publish automatically detects the token above
    - echo "🟢 Auto-publishing to JSR..."
    - |
      cd ./dist/logcad
      npx jsr publish --token ${JSR_API_KEY} --allow-dirty
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*$/
      when: always

