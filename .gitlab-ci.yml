image: node:18

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_PRODUCTION: "false"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

stages:
  - lint
  - test
  - build
  - deploy
# ------------------------------------------------------
# Lint stage
# ------------------------------------------------------
lint:
  stage: lint
  script:
    - echo "🔍 Linting code..."
    - npm ci
    - npm run lint
  only:
    - merge_requests
    - main
    - tags
  allow_failure: false

# ------------------------------------------------------
# Test stage
# ------------------------------------------------------
test:
  stage: test
  script:
    - echo "🔵 Running tests..."
    - npm ci
    - npm test
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - tags
  allow_failure: false

# ------------------------------------------------------
# Build stage
# ------------------------------------------------------
build:
  stage: build
  script:
    - echo "🔵 Building package..."
    - npm ci
    - npm run build
    - echo "✅ Build complete!"
    - ls -lah dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - tags
  allow_failure: false

# ------------------------------------------------------
# Deploy to Generic Package Registry
# ------------------------------------------------------
deploy:generic:
  stage: deploy
  image: node:18
  needs: ["build"]
  before_script:
    - apt-get update && apt-get install -y jq
  script:
    - VERSION=$(jq -r .version package.json)
    - echo "🔵 Uploading artifacts for version ${VERSION}..."
    # Define the list of files to upload
    - FILES="logcad.esm.js logcad.esm.js.map logcad.esm.min.js logcad.js logcad.js.map logcad.min.js logcad.min.js.map"
    - |
      for FILE in $FILES; do
        echo "Uploading dist/$FILE..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "dist/$FILE" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${VERSION}/${FILE}"
      done
    - echo "✅ All artifacts uploaded to Generic Registry"
  only:
    - tags

# ------------------------------------------------------
# Deploy to npm (triggers jsDelivr automatically)
# ------------------------------------------------------
deploy:npm:
  stage: deploy
  image: node:18
  before_script:
    - echo "🔵 Preparing npm publish..."
    - npm ci
    - npm run build
  script:
    - echo "🔵 Publishing to npm..."
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "❌ NPM_TOKEN not set. Skipping npm publish."
        exit 1
      fi
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm whoami
    - npm publish --access public
    - echo "✅ Published to npm!"
    - echo ""
    - echo "🔵 Package available on jsDelivr:"
    - echo "   https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${CI_COMMIT_TAG:-latest}/dist/logcad.min.js"
    - echo "   https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${CI_COMMIT_TAG:-latest}/dist/logcad.esm.js"
  only:
    - tags
  except:
    - /^v?\d+\.\d+\.\d+.*$/  # Only publish semantic version tags
  when: manual
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}

# ------------------------------------------------------
# Auto-deploy on version tags (v1.0.0, 1.0.0, etc.)
# ------------------------------------------------------
deploy:npm:auto:
  stage: deploy
  image: node:18
  before_script:
    - echo "🔵 Preparing npm publish..."
    - npm ci
    - npm run build
  script:
    - echo "🔵 Auto-publishing to npm..."
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "❌ NPM_TOKEN not set. Skipping npm publish."
        exit 1
      fi
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm whoami
    - npm publish --access public
    - echo "✅ Published to npm!"
    - echo ""
    - echo "🔵 Package available on jsDelivr:"
    - echo "   https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${CI_COMMIT_TAG}/dist/logcad.min.js"
    - echo "   https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${CI_COMMIT_TAG}/dist/logcad.esm.js"
  only:
    - /^v?\d+\.\d+\.\d+$/  # Matches v1.0.0 or 1.0.0 format
  when: on_success
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}
    
# ------------------------------------------------------
# Create GitLab release
# ------------------------------------------------------
release:
  stage: deploy
  image: node:18
  # Ensure the files are uploaded to the registry before creating the release links
  needs: 
    - job: deploy:generic
      artifacts: false
    - job: build
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y jq
  script:
    - echo "🔵 Preparing release metadata..."
    # Extract version to a variable
    - VERSION=$(jq -r .version package.json)
    # Save variable to a .env file so the 'release' keyword can read it
    - echo "PROJECT_VERSION=$VERSION" >> build.env
    - echo "Generated release logic for version $VERSION"
  artifacts:
    reports:
      dotenv: build.env
  release:
    name: 'Release $PROJECT_VERSION'
    tag_name: '$CI_COMMIT_TAG'
    description: |
      Automated release for version $PROJECT_VERSION
      
      ## 📦 npm Package
      - [npm package](https://www.npmjs.com/package/${CI_PROJECT_NAME}/v${PROJECT_VERSION})

      ## 🌐 jsDelivr CDN
      - ESM: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js`
      - UMD: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js`
      - ESM-MIN: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.min.js`
      - UMD-MIN: `https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.min.js`
    
      ## 📋 Usage

      ```html
      // UMD (Browser)
      <script src="https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js"></script>
      ```

      ```javascript
      // ESM (Module)
      import logcad from 'https://cdn.jsdelivr.net/npm/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js';
      ```
    # Direct links to the Generic Registry files uploaded in the previous step
    assets:
      links:
        - name: 'logcad.esm.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.esm.js'
        - name: 'logcad.esm.js.map'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.esm.js.map'
        - name: 'logcad.esm.min.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.esm.min.js'
        - name: 'logcad.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.js'
        - name: 'logcad.js.map'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.js.map'
        - name: 'logcad.min.js'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.min.js'
        - name: 'logcad.min.js.map'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/logcad/${PROJECT_VERSION}/logcad.min.js.map'
  only:
    - tags