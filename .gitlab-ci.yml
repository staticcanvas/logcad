release:generate:generic:release:metadata:
  stage: release
  image: sgkens/phellams-automator:2.5.1
  needs:
    - job: deploy:generic
      artifacts: false
    - job: build
      artifacts: true
    - job: deploy:npm:auto
      artifacts: false
  
  before_script:
    - echo "🔵 Preparing release notes generation..."
    # pull in automator scripts
    - git clone https://gitlab.com/phellams/automator-devops.git
    # fetch full git history for accurate release notes
    - git fetch --unshallow

  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*$/
      when: always

  script:
    # ---------------------------------------------------------
    # STEP 1: Create the PowerShell Script
    # We write the content to 'generate_meta.ps1' first.
    # We use 'EOF' (quoted) to prevent Bash from trying to expand variables.
    # ---------------------------------------------------------
    - |
      cat <<'EOF' > generate_meta.ps1

      # Import Modules
      using module ./automator-devops/scripts/core/Request-GenericPackage.psm1
      using module ./automator-devops/scripts/core/Get-RemoteFileHash.psm1
      using module ./automator-devops/scripts/core/Get-ReleaseNotes.psm1

      Write-Host "🟢 Generating Generic Package Registry download links for version $env:PROJECT_VERSION..."
            
      # Ensure Output Directory Exists
      $OutputDir = "dist/$env:CI_PROJECT_NAME"
      if (!(Test-Path -Path $OutputDir)) {
          New-Item -ItemType Directory -Force -Path $OutputDir | Out-Null
      }

      # Fetch Links
      $links = Request-GenericPackage -ProjectId $env:CI_PROJECT_ID -PackageName $env:CI_PROJECT_NAME -ProjectName $env:CI_PROJECT_NAME -Namespace $env:CI_PROJECT_NAMESPACE -PackageVersion $env:PROJECT_VERSION -ApiKey $env:CI_JOB_TOKEN -ApiUrl $env:CI_API_V4_URL -ci
      
      # Filter Links (Using $env:PROJECT_NAME instead of Bash syntax)
      $ESM       = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.esm.js" }       | Sort-Object created_at -Descending | Select-Object -First 1
      $ESMMap    = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.esm.js.map" }   | Sort-Object created_at -Descending | Select-Object -First 1
      $ESMMin    = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.esm.min.js" }   | Sort-Object created_at -Descending | Select-Object -First 1
      $ESMMinMap = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.esm.min.js.map" }| Sort-Object created_at -Descending | Select-Object -First 1
      $UMD       = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.js" }           | Sort-Object created_at -Descending | Select-Object -First 1
      $UMDMin    = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.min.js" }       | Sort-Object created_at -Descending | Select-Object -First 1
      $UMDMap    = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.js.map" }       | Sort-Object created_at -Descending | Select-Object -First 1
      $UMDMinMap = $links | Where-Object { $_.file_name -eq "$env:PROJECT_NAME.min.js.map" }   | Sort-Object created_at -Descending | Select-Object -First 1
      
      # Create JSON
      $all_links = @($ESM, $ESMMap, $ESMMin, $ESMMinMap, $UMD, $UMDMin, $UMDMap, $UMDMinMap)
      $all_links | ConvertTo-Json -Depth 5 | Out-File -FilePath "$OutputDir/generic-package-links.json" -Encoding utf8
      Write-Host "✅ Generic Package Registry download links generated."
      
      # Create Checksums
      Write-Host "🟢 Generic Package Checksums"
      $all_links | Select-Object file_name, checksum | ConvertTo-Json -Depth 2 | Out-File -FilePath "$OutputDir/generic-package-checksums.json" -Encoding utf8
      Write-Host "✅ Finished generating Generic Package Registry checksums."
      
      # Generate Release Notes
      Write-Host "🟢 Generating release notes for version $env:PROJECT_VERSION..."
      $Release_notes = Get-ReleaseNotes -AheadOnly -FeatureNotes -BreakingChanges -FeatureAdditions -Notes -FeatureUpdates -CommitLink -CommitLinkPrefix gitlab -NameSpace $env:CI_PROJECT_NAME
      $Release_notes | Out-File -FilePath "$OutputDir/release-notes.md" -Encoding utf8
      Write-Host "✅ Release notes generated at $OutputDir/release-notes.md"
      
      EOF

    # ---------------------------------------------------------
    # STEP 2: Execute the Script
    # ---------------------------------------------------------
    - pwsh ./generate_meta.ps1

    # ---------------------------------------------------------
    # STEP 3: Upload (Bash)
    # We must point to the correct path in dist/
    # ---------------------------------------------------------
    - |
      echo "🚀 Uploading metadata to Generic Registry..."
      cd "dist/${CI_PROJECT_NAME}"
      
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file "generic-package-checksums.json" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PROJECT_NAME}/${PROJECT_VERSION}/generic-package-checksums.json"
      
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file "generic-package-links.json" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PROJECT_NAME}/${PROJECT_VERSION}/generic-package-links.json"
      
      echo "✅ Upload complete."

  artifacts:
    reports:
      dotenv: build.env
    paths:
      # Use wildcard if you aren't 100% sure of the project name casing, 
      # otherwise ensure this matches the $OutputDir created above.
      - dist/*/generic-package-links.json
      - dist/*/generic-package-checksums.json
      - dist/*/release-notes.md

# ------------------------------------------------------
# Create GitLab release
# As Per: https://docs.gitlab.com/user/project/releases/release_cli/
#   - Release-cli has been deprecated, use gitlab-cli instead
# ------------------------------------------------------
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: deploy:generic
      artifacts: false
    - job: build
      artifacts: true
    - job: deploy:npm:auto
      artifacts: false
    - job: release:generate:generic:release:metadata
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*$/
      when: always  
# 🛠️ FIX: Install bash so the runner's scripts don't crash
  before_script:
    - apk add --no-cache bash
    - apk add --no-cache jq
  script:
    - echo "🟢 Creating GitLab release for version ${PROJECT_VERSION}..."
    - RELEASE_NOTES=$(cat dist/${CI_PROJECT_NAME}/release-notes.md)
  release:
    name: 'Release ${PROJECT_NAME} v${PROJECT_VERSION}'
    tag_name: '${PROJECT_VERSION}'
    ref: '$CI_COMMIT_SHA'     
    assets:
      links:
        - name: '${PROJECT_NAME}.esm.js'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.esm.js") | .url)'
        - name: '${PROJECT_NAME}.esm.js.map'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.esm.js.map") | .url)'
        - name: '${PROJECT_NAME}.esm.min.js'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.esm.min.js") | .url)'
        - name: '${PROJECT_NAME}.js'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.js") | .url)'
        - name: '${PROJECT_NAME}.js.map'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.js.map") | .url)'
        - name: '${PROJECT_NAME}.min.js'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.min.js") | .url)'
        - name: '${PROJECT_NAME}.min.js.map'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="${PROJECT_NAME}.min.js.map") | .url)'
        - name: 'Generic Package Checksums'
          url: '$(jq -r ./generic-package-links.json | .[] | select(.file_name=="generic-package-links.json") | .url)'
        - name: 'Release Notes'
          url: '$(jq -r ./generic-package-checksums.json | .[] | select(.file_name=="generic-package-checksums.json") | .url)'
    description: |  
      # 📦 ${PROJECT_VERSION} Release

      ${RELEASE_NOTES}

      ## **Package Links**

      ### ▪️ NPM Registry

      * https://www.npmjs.com/package/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/v/${PROJECT_VERSION}

      ### ▪️ JSR (JavaScript Registry)

      * https://www.jsr.io/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/v/${PROJECT_VERSION}

      ### ▪️ Unpkg CDN
      
      * ***ESM***: https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js
      * ***UMD***: https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js
      - ***ESM Minified***: https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.min.js
      - ***UMD Minified***: https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.min.js

      ### ▪️ jsDelivr CDN

      - ***ESM***: `https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.js`
      - ***UMD***: `https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js`
      - ***ESM Minified***: `https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.esm.min.js`
      - ***UMD Minified***: `https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.min.js`

      ## Usage

      ### UMD (Browser)

      UMD will auto-load `${CI_PROJECT_NAME}` into the global scope `window.*`

      ```html
      <script src="https://cdn.jsdelivr.net/npm/package/@${CI_PROJECT_NAMESPACE}/logcad/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad.js"></script>
      ```

      ### ESM (Module)

      ESM can be imported into your JavaScript/TypeScript projects as follows:

      ```javascript
      import * as logcad from 'https://cdn.jsdelivr.net/npm/package/@${CI_PROJECT_NAMESPACE}/logcad/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/logcad+esm';
      ```
  artifacts: # Required to import PROJECT_VERSION from build.env  script:
    reports:
    # This allows the 'release' section below to access $PROJECT_VERSION
      dotenv: build.env 