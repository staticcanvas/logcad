image: node:${NODE_VERSION}

variables:
  NODE_VERSION: '25.2.1'
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  NPM_CONFIG_PRODUCTION: 'false'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

stages:
  - lint
  - test
  - build
  - deploy
  - release
# ------------------------------------------------------
# Lint stage
# ------------------------------------------------------
lint:
  stage: lint
  script:
    - echo "🔍 Linting code..."
    - npm ci
    - npm run lint
  only:
    - merge_requests
    - main
    - tags
  allow_failure: false

